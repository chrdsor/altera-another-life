<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALTERA · Første hjem · demo</title><style>*{box-sizing:border-box}body{margin:0;background:#141e29;color:#f6f2ec;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px}a{color:#f4ce99}.eyebrow{letter-spacing:.16em;color:#d9b787;font-size:12px}.room{height:350px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#b8b6ab 0 67%,#9e826c 67%);border:8px solid #746253}.window{position:absolute;left:10%;top:9%;width:29%;height:47%;background:linear-gradient(#8cb1c0,#c6d9d8);border:12px solid #f1e6d8;box-shadow:0 6px 16px #0003}.sofa{position:absolute;left:7%;bottom:7%;width:46%;height:25%;background:#526b74;border-radius:20px 20px 8px 8px;box-shadow:0 12px #394d55}.table{position:absolute;left:54%;bottom:5%;width:30%;height:10%;background:#5b3c31;border-radius:50%;box-shadow:0 12px #3b2924}.frame{position:absolute;right:15%;top:17%;width:19%;height:34%;background:#58483c;padding:8px;box-shadow:0 7px 18px #0005}.art{width:100%;height:100%;background:linear-gradient(#9cc4cf 0 49%,#587b88 49% 57%,#d3a87d 57%);position:relative}.art:after{content:'NORDKAIEN';position:absolute;bottom:10%;left:5%;font-size:9px;font-weight:bold;color:#253745}.frame.locked{filter:grayscale(1);opacity:.38}.card{margin-top:18px;padding:18px;background:#ffffff0d;border:1px solid #ffffff24;border-radius:16px}.actions{display:flex;gap:12px;flex-wrap:wrap}button{padding:12px 18px;border:0;border-radius:10px;background:#d8ad78;color:#211a15;font-weight:700;cursor:pointer}button:disabled{opacity:.4}p{line-height:1.5}</style></head><body><main><div class="eyebrow">ALTERA · DISTRICT 01 · LOKAL DEMO</div><h1>Din første leilighet</h1><p>Et tidlig boliginteriør. Postkortet fra Maja kan henges opp her etter velkomstoppdraget.</p><div class="room" role="img" aria-label="Leilighet med sofa, vindu, bord og ramme til havnepostkort"><div class="window"></div><div class="sofa"></div><div class="table"></div><div id="frame" class="frame locked"><div class="art"></div></div></div><section class="card"><h2>Havnepostkort</h2><p id="status" aria-live="polite"></p><div class="actions"><button id="place">Heng opp postkort</button><a href="alpha.html">Tilbake til District 01</a><a href="alpha-cafe.html">Besøk Kafé Varm</a></div><p style="font-size:13px;opacity:.7">Denne dekorasjonen lagres bare i nettleseren og gir ingen server-eid gjenstand.</p></section></main><script type="module">import {normalizeQuest,QUEST_REWARD} from './alpha-quest.mjs';import {readPostcardPlacement,placePostcard} from './alpha-home-demo.mjs';const key='altera-alpha-demo-quest-v1',placementKey='altera-alpha-demo-home-v1';let quest;try{quest=normalizeQuest(JSON.parse(localStorage.getItem(key)||'null'))}catch{quest=normalizeQuest(null)}const unlocked=quest.reward===QUEST_REWARD;const frame=document.getElementById('frame'),status=document.getElementById('status'),button=document.getElementById('place');let placed=readPostcardPlacement(localStorage.getItem(placementKey),unlocked);function render(){frame.classList.toggle('locked',!placed);status.textContent=!unlocked?'Fullfør Majas velkomstoppdrag for å låse opp postkortet.':placed?'Postkortet henger på veggen og vil være her neste gang.':'Du har mottatt postkortet! Heng det opp på veggen.';button.disabled=!unlocked||placed;button.textContent=placed?'Postkort plassert':'Heng opp postkort'}button.onclick=()=>{placed=placePostcard(unlocked,placed);try{localStorage.setItem(placementKey,JSON.stringify({postcard:placed}))}catch(error){console.warn('Could not save local decoration',error)}render()};render();</script></body></html>
