name: ALTERA Alpha Quest Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/first-living-district-quest]
permissions:
  contents: read
jobs:
  quest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check quest logic
        run: node --test tests/alpha-quest.test.mjs tests/alpha-home-demo.test.mjs tests/alpha-movement.test.mjs tests/alpha-wayfinding.test.mjs
      - name: Check alpha script syntax
        run: node --check alpha.js && node --check alpha-interior.js && node --check alpha-movement.mjs && node --check alpha-map-ui.mjs && node --check alpha-wayfinding.mjs && node --check alpha-harbor-art.mjs && node --check alpha-character-art.mjs
