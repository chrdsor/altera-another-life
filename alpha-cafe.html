<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ALTERA · Kafé Varm</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f6f1e9;background:#171e26}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#17212c,#29242a)}main{max-width:880px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#f6dbb1}.eyebrow{letter-spacing:.15em;color:#e5ba83;font-size:12px}.scene{height:clamp(230px,43vw,390px);border-radius:20px;position:relative;overflow:hidden;border:1px solid #ffffff26;background:linear-gradient(#556b79 0 43%,#af8b6b 43% 46%,#765945 46% 100%);box-shadow:0 25px 65px #0006}.window{position:absolute;left:10%;top:10%;width:30%;height:43%;border:12px solid #463d3a;border-radius:5px;background:linear-gradient(160deg,#bed0d5 0 58%,#658997 58% 65%,#436b78 65%)}.window:after{content:'';position:absolute;left:48%;top:0;bottom:0;border-left:9px solid #463d3a}.counter{position:absolute;right:3%;bottom:15%;width:46%;height:30%;background:linear-gradient(#b88b63 0 14%,#654331 14%);border-radius:6px;box-shadow:0 15px 20px #0005}.counter:before{content:'KAFÉ VARM';position:absolute;left:12%;top:42%;font-weight:800;letter-spacing:.17em;color:#f6dbb1}.lamp{position:absolute;top:-30px;right:25%;width:7px;height:95px;background:#38302b}.lamp:after{content:'';position:absolute;top:90px;left:-38px;border-left:42px solid transparent;border-right:42px solid transparent;border-top:35px solid #d7a879}.table{position:absolute;left:14%;bottom:14%;width:31%;height:8%;border-radius:50%;background:#4a3026;box-shadow:0 12px 0 -2px #2c221f}.plant{position:absolute;left:6%;bottom:12%;font-size:65px}.person{position:absolute;right:20%;bottom:41%;font-size:66px;filter:drop-shadow(2px 6px 3px #0005)}.card{background:#ffffff0d;border:1px solid #ffffff24;border-radius:16px;padding:18px;margin-top:16px}button,.btn{display:inline-block;background:#d6a46c;color:#211910;border:0;border-radius:11px;padding:12px 17px;font:700 15px system-ui;cursor:pointer;text-decoration:none}button:disabled{opacity:.45}.actions{display:flex;gap:10px;flex-wrap:wrap}.note{font-size:13px;color:#c3b9b0}#dialogue{line-height:1.6;min-height:50px}#reward{color:#f8dba6;font-weight:700}
</style></head><body><main><div class="top"><div><div class="eyebrow">ALTERA · DISTRICT 01</div><h1>Kafé Varm</h1></div><a href="alpha.html">← Tilbake til gaten</a></div>
<div class="scene" role="img" aria-label="Illustrert kaféinteriør med vindu, disk, bord, lampe og kafévert"><div class="window"></div><div class="lamp"></div><div class="counter"></div><div class="table"></div><div class="plant">🪴</div><div class="person">🧑‍🍳</div></div>
<section class="card"><h2>Maja · kafévert</h2><p id="dialogue" aria-live="polite"></p><div class="actions"><button id="talk">Snakk med Maja</button><a class="btn" href="alpha.html">Gå ut</a></div><p class="note">Dette er et tidlig, stilisert 2D-interiør. Oppdraget lagres lokalt i demoen, ikke på spillserveren.</p></section>
<section class="card"><h2>Oppdrag</h2><p id="objective"></p><p id="reward"></p></section></main>
<script type="module">
import {normalizeQuest,advanceQuest,questObjective,questDialogue,QUEST_REWARD} from './alpha-quest.mjs';
const key='altera-alpha-demo-quest-v1',get=id=>document.getElementById(id);
let quest;try{quest=normalizeQuest(JSON.parse(localStorage.getItem(key)||'null'))}catch{quest=normalizeQuest(null)}
function render(){get('objective').textContent=questObjective(quest);get('reward').textContent=quest.reward===QUEST_REWARD?'✓ Samleobjekt: Havnepostkort (lokal demo)':'';get('dialogue').textContent=questDialogue(quest)}
get('talk').addEventListener('click',()=>{const before=quest.step;const result=advanceQuest(quest,'talk_cafe');quest=result.state;if(result.changed){try{localStorage.setItem(key,JSON.stringify(quest))}catch(e){console.warn('Could not save demo quest',e)}}render()});render();
</script></body></html>
